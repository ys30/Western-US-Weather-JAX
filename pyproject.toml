[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"
[project]
name = "western-us-weather-jax"
version = "0.1.0"
description = "JAX CNN 24-hour regional temperature forecasting reproducible MVP"
requires-python = ">=3.10"
dependencies = ["jax>=0.4.30", "numpy>=1.24", "xarray>=2023.1", "netCDF4>=1.6"]
[project.optional-dependencies]
zarr = ["zarr>=2.16"]
test = ["pytest>=7"]
[tool.setuptools.packages.find]
include = ["weatherjax*"]
