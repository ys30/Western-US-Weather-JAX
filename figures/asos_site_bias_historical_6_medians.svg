<text x="945" y="99" text-anchor="end" font-size="12" font-family="Arial,sans-serif" fill="#64748b">Bias² / MSE</text><text x="30" y="456" font-size="13" font-family="Arial,sans-serif" fill="#405464">Bars represent median (forecast − ASOS) mean error, not RMSE or causal attribution.</text><text x="30" y="480" font-size="13" font-family="Arial,sans-serif" fill="#405464">Absolute RMSE remains 3.2–5.0 K; much of it reflects time-varying mismatch after removing the mean error.</text><text x="30" y="504" font-size="13" font-family="Arial,sans-serif" fill="#405464">Computed from 54 archived station × seed × prediction-arm comparisons; six site-year medians shown.</text><text x="30" y="530" font-size="12" font-family="Arial,sans-serif" fill="#637784">Retrospective ASOS–ERA5 agreement, not an independent operational forecast benchmark.</text></svg>