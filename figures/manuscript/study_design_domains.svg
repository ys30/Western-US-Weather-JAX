<text x="34" y="58" font-size="13">ERA5 t2m · six-hour sampling · 24-hour lead · schematic coordinates (not a geographic basemap)</text>
<rect x="32" y="84" width="450" height="318" rx="9" fill="#f7fafc" stroke="#ccd5df"/>
