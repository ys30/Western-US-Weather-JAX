<line x1="105" y1="135" x2="105" y2="348"/><line x1="205" y1="135" x2="205" y2="348"/><line x1="305" y1="135" x2="305" y2="348"/><line x1="405" y1="135" x2="405" y2="348"/>
<line x1="90" y1="170" x2="425" y2="170"/><line x1="90" y1="235" x2="425" y2="235"/><line x1="90" y1="300" x2="425" y2="300"/>
</g>
<rect x="101" y="149" width="202" height="174" fill="#b8d8ee" fill-opacity=".75" stroke="#22659a" stroke-width="2.3"/>
<rect x="320" y="245" width="103" height="88" fill="#f6d3bc" fill-opacity=".9" stroke="#be652e" stroke-width="2.3"/>
<text x="141" y="214" font-size="17" font-weight="bold" fill="#194d78">Source</text>
<text x="120" y="237" font-size="12">31–43°N</text><text x="120" y="255" font-size="12">121–109°W</text>
<text x="326" y="278" font-size="13" font-weight="bold" fill="#8e481e">Southwest</text>
<text x="330" y="295" font-size="11">30–36°N</text><text x="330" y="310" font-size="11">108–102°W</text>
<text x="87" y="370" font-size="12">West</text><text x="406" y="370" font-size="12">East</text>
<text x="48" y="390" font-size="11">Rectangle positions schematic; labels give exact experimental bounds.</text>
<rect x="502" y="84" width="505" height="318" rx="9" fill="#f7fafc" stroke="#ccd5df"/>
<text x="520" y="108" font-size="16" font-weight="bold">B  Chronology and information boundaries</text>
<rect x="523" y="143" width="212" height="62" rx="6" fill="#d6e8f5" stroke="#22659a"/>
<rect x="739" y="143" width="109" height="62" rx="6" fill="#f8e9c4" stroke="#9a7432"/>
<rect x="852" y="143" width="133" height="62" rx="6" fill="#d9eae0" stroke="#2a7655"/>
<text x="550" y="164" font-size="16" font-weight="bold">2019–2020</text><text x="550" y="186" font-size="12">Source training</text>
<text x="751" y="164" font-size="16" font-weight="bold">2021</text><text x="750" y="186" font-size="12">Validation</text>
<text x="872" y="164" font-size="16" font-weight="bold">2022</text><text x="862" y="186" font-size="12">Southwest test</text>
<text x="522" y="238" font-size="13" font-weight="bold">Historical-feature adaptation</text>
<rect x="523" y="255" width="325" height="49" rx="6" fill="#f9daca" stroke="#be652e"/>
<text x="546" y="275" font-size="13">Southwest 2019–2021 t2m</text><text x="546" y="292" font-size="12">climatology; not a gradient update</text>
<path d="M848 279 H919 V220" fill="none" stroke="#be652e" stroke-width="2"/>
<path d="M914 227 L919 219 L924 227" fill="none" stroke="#be652e" stroke-width="2"/>
<text x="522" y="344" font-size="13">Source-only protocol: no target historical climatology.</text>
<text x="522" y="365" font-size="12">Both use recent target inputs preceding each forecast issue.</text>
<rect x="32" y="422" width="975" height="152" rx="9" fill="#fafbfc" stroke="#ccd5df"/>
<text x="49" y="446" font-size="16" font-weight="bold">C  Evaluation paths — models remain frozen during Southwest 2022 inference</text>
<rect x="52" y="466" width="215" height="53" rx="6" fill="#e0edf7" stroke="#22659a"/><text x="68" y="487" font-size="14" font-weight="bold">Source CNN training</text><text x="68" y="503" font-size="12">source-only or climate-aware</text>
<path d="M270 492 H310" stroke="#44576d" stroke-width="2"/><path d="M303 487 L312 492 L303 497" fill="none" stroke="#44576d" stroke-width="2"/>
<rect x="313" y="466" width="234" height="53" rx="6" fill="#e0edf7" stroke="#22659a"/><text x="330" y="487" font-size="14" font-weight="bold">Freeze weights + normalization</text><text x="330" y="504" font-size="12">source-selected hyperparameters</text>
<path d="M550 492 H585" stroke="#44576d" stroke-width="2"/><path d="M578 487 L587 492 L578 497" fill="none" stroke="#44576d" stroke-width="2"/>
<rect x="588" y="466" width="398" height="53" rx="6" fill="#e1efe6" stroke="#2a7655"/><text x="605" y="487" font-size="14" font-weight="bold">2022 target inference and paired evaluation</text><text x="605" y="504" font-size="12">Annual RMSE; observed-hot RMSE (t2m ≥305 K)</text>
<text x="51" y="548" font-size="12">Comparators differ: source-selected persistence/climatology blend (adapted) vs 24-hour persistence (source-only).</text>
<text x="34" y="599" font-size="11">Visual schematic only. No claims about country/state boundaries, physical distance, or operational ERA5 data latency.</text>
</g></svg>