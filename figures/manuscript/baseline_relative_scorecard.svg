<text x="32" y="517" class="small">Adapted: reference = source-selected persistence/climatology blend; target 2019–2021 history used.</text>
<text x="32" y="538" class="small">Source-only: reference = 24-hour persistence; no target historical climatology fitted.</text>
<text x="32" y="559" class="small">Change = 100 × (1 − CNN RMSE / protocol reference RMSE). Comparisons across protocols are not causal.</text>
<text x="32" y="581" class="small">Green: improvement; salmon: deterioration. Observed-hot is truth-conditioned, not event detection.</text>
