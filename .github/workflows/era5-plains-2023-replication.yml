name: Southern Plains 2023 matched frozen replication
on:
  push:
    paths:
      - '.github/workflows/era5-plains-2023-replication.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plains-2023-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[test,zarr]' gcsfs
      - name: Fetch complete source and target ERA5 years
        run: |
          python scripts/fetch_arco_era5.py --start 2019-01-01 --end '2022-12-31T23:00' --stride 6 --lat-min 31 --lat-max 43 --lon-min -121 --lon-max -109 --output input/source.nc
          python scripts/fetch_arco_era5.py --start 2019-01-01 --end '2023-12-31T23:00' --stride 6 --lat-min 32 --lat-max 38 --lon-min -101 --lon-max -95 --output input/target.nc
      - name: Check complete 2023 target UTC coverage
        run: |
          python - <<'PY'
          import xarray as xr,numpy as np
          t=xr.open_dataset('input/target.nc').time.values.astype('datetime64[h]')
          s=t[(t>=np.datetime64('2023-01-01'))&(t<np.datetime64('2024-01-01'))]
          assert len(s)==1460,(len(s),s[:4],s[-4:])
          assert s[0]==np.datetime64('2023-01-01T00') and s[-1]==np.datetime64('2023-12-31T18')
          assert np.all(np.diff(s)==np.timedelta64(6,'h'))
          print('2023 complete:',len(s),'steps')
          PY
      - name: Fit two arms and evaluate three paired seeds
        run: |
          for seed in 42 7 123; do
            for mode in historical source_mean; do
              python scripts/climatology_aware_cnn.py --data input/source.nc --train-until 2021-01-01 --validate-until 2022-01-01 --epochs 40 --hot-weight 2 --seed "$seed" --climatology-feature-mode "$mode" --checkpoint-path "outputs/archive/$mode/seed-$seed.npz" --output "outputs/archive/$mode/source-$seed.json"
              python scripts/frozen_spatial_eval.py --data input/target.nc --checkpoint "outputs/archive/$mode/seed-$seed.npz" --test-start 2023-01-01 --output "outputs/archive/$mode/target-$seed.json" --diagnostics-output "outputs/archive/$mode/fields-$seed.npz"
            done
            for days in 3 7 14 28; do
              python scripts/matched_direct_bootstrap.py --historical "outputs/archive/historical/fields-$seed.npz" --source-mean "outputs/archive/source_mean/fields-$seed.npz" --days "$days" --draws 2000 --output "outputs/archive/direct-seed-$seed-block-$days.json"
            done
          done
      - name: Record provenance and hashes
        if: always()
        run: |
          python -m pip freeze > resolved-requirements.txt
          git rev-parse HEAD > git-commit.txt
          python -c 'import jax; print(jax.__version__, jax.devices())' > device-info.txt
          python scripts/hash_experiment_files.py --root input --root outputs/archive --output outputs/archive/sha256-manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plains-2023-complete-replication
          retention-days: 30
          if-no-files-found: error
          path: |
            input/*.nc
            outputs/archive/**
            resolved-requirements.txt
            git-commit.txt
            device-info.txt
