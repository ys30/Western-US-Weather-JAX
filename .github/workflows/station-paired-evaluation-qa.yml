name: Station paired-evaluation QA
on:
  push:
    paths:
      - 'scripts/evaluate_paired_station_predictions.py'
      - 'scripts/match_asos_prediction_times.py'
      - 'scripts/sample_forecast_grid_at_stations.py'
      - 'scripts/reconstruct_matched_archive_fields.py'
      - 'scripts/station_lapse_rate_sensitivity.py'
      - 'scripts/test_reconstruct_matched_archive_fields.py'
      - '.github/workflows/station-paired-evaluation-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  station-paired-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install evaluation dependencies
        run: python -m pip install 'numpy>=1.24' 'pandas>=2.0' 'xarray>=2023.1' scipy netCDF4
      - name: Check compilation and synthetic end-to-end invariants
        run: |
          python -m py_compile scripts/evaluate_paired_station_predictions.py scripts/match_asos_prediction_times.py scripts/sample_forecast_grid_at_stations.py
          python scripts/evaluate_paired_station_predictions.py --self-test
          python scripts/match_asos_prediction_times.py --self-test
          python scripts/sample_forecast_grid_at_stations.py --self-test
          python scripts/test_reconstruct_matched_archive_fields.py
          python scripts/station_lapse_rate_sensitivity.py --self-test
