name: Station paired-evaluation QA
on:
  push:
    paths:
      - 'scripts/evaluate_paired_station_predictions.py'
      - 'scripts/match_asos_prediction_times.py'
      - '.github/workflows/station-paired-evaluation-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  station-paired-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install evaluation dependencies
        run: python -m pip install 'numpy>=1.24' 'pandas>=2.0'
      - name: Check compilation and synthetic end-to-end invariants
        run: |
          python -m py_compile scripts/evaluate_paired_station_predictions.py scripts/match_asos_prediction_times.py
          python scripts/evaluate_paired_station_predictions.py --self-test
          python scripts/match_asos_prediction_times.py --self-test
