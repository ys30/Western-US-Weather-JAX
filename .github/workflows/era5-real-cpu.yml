name: Real ERA5 CPU experiment
on:
  push:
    branches: [main]
    paths:
      - 'weatherjax/**'
      - 'scripts/**'
      - '.github/workflows/era5-real-cpu.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: era5-real-cpu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-era5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[test,zarr]' gcsfs
      - run: python scripts/fetch_arco_era5.py --start 2020-01-01 --end 2021-12-31 --stride 6 --output input/real_era5.nc
      - run: python -m weatherjax.preflight input/real_era5.nc --timestep-hours 6 --lead-hours 24 --report outputs/real-era5/preflight.json
      - run: python -m weatherjax --data input/real_era5.nc --lead-steps 4 --history-steps 1 --train-until 2021-01-01 --validate-until 2021-07-01 --epochs 40 --group-metrics --lr 0.001 --output outputs/real-era5/single-frame
      - run: python -m weatherjax --data input/real_era5.nc --lead-steps 4 --history-steps 4 --zero-residual --time-features --train-until 2021-01-01 --validate-until 2021-07-01 --epochs 40 --group-metrics --lr 0.001 --output outputs/real-era5/four-frame-zero-init-time
      - run: python scripts/summarize_experiment.py outputs/real-era5/single-frame/metrics.json outputs/real-era5/four-frame-zero-init-time/metrics.json --output outputs/real-era5/comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-era5-cpu-metrics
          path: |
            outputs/real-era5/**/*.json
            outputs/real-era5/comparison.json
          if-no-files-found: warn
