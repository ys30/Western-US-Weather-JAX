name: ERA5 frozen source CNN to Southwest region
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/era5-frozen-spatial.yml'
      - 'scripts/frozen_spatial_eval.py'
      - 'scripts/climatology_aware_cnn.py'
      - 'scripts/fetch_arco_era5.py'
      - 'weatherjax/**'
permissions:
  contents: read
jobs:
  frozen-spatial:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[test,zarr]' gcsfs
      - name: Retrieve original and geographically disjoint Southwest ERA5
        run: |
          python scripts/fetch_arco_era5.py --start 2019-01-01 --end 2022-12-31 --stride 6 --lat-min 31 --lat-max 43 --lon-min -121 --lon-max -109 --output input/source.nc
          python scripts/fetch_arco_era5.py --start 2019-01-01 --end 2022-12-31 --stride 6 --lat-min 30 --lat-max 36 --lon-min -108 --lon-max -102 --output input/target.nc
      - name: Train original-area model only and export source checkpoints
        run: |
          for seed in 42 7 123; do
            python scripts/climatology_aware_cnn.py --data input/source.nc --train-until 2021-01-01 --validate-until 2022-01-01 --epochs 40 --seed "$seed" --hot-weight 2 --checkpoint-path "outputs/source/model-${seed}.npz" --output "outputs/source/report-${seed}.json"
          done
      - name: Evaluate frozen original weights in Southwest
        run: |
          for seed in 42 7 123; do
            python scripts/frozen_spatial_eval.py --data input/target.nc --checkpoint "outputs/source/model-${seed}.npz" --test-start 2022-01-01 --output "outputs/frozen-southwest/seed-${seed}.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-southwest-results
          path: |
            outputs/frozen-southwest/*.json
            outputs/source/*.json
          if-no-files-found: warn
