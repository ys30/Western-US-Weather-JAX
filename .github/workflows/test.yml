name: Python unit tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: python -m weatherjax --epochs 2 --output outputs/ci-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-smoke-metrics
          path: outputs/ci-smoke/metrics.json
          if-no-files-found: ignore
