name: ERA5 independent-year 2022 holdout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/era5-crossyear.yml'
      - 'weatherjax/**'
      - 'scripts/**'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: era5-crossyear-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent-year:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[test,zarr]' gcsfs
      - name: Fetch four years of public ERA5
        run: python scripts/fetch_arco_era5.py --start 2019-01-01 --end 2022-12-31 --stride 6 --output input/era5_2019_2022.nc
      - name: Check ERA5 timestamps and units
        run: python -m weatherjax.preflight input/era5_2019_2022.nc --timestep-hours 6 --lead-hours 24 --report outputs/era5-crossyear/preflight.json
      - name: CNN train 2019-2020, validate 2021, evaluate independent 2022
        run: python -m weatherjax --data input/era5_2019_2022.nc --lead-steps 4 --history-steps 4 --zero-residual --time-features --train-until 2021-01-01 --validate-until 2022-01-01 --epochs 40 --group-metrics --lr 0.001 --output outputs/era5-crossyear/cnn
      - name: Heat-weighted CNN sensitivity with predefined 305 K threshold
        run: python -m weatherjax --data input/era5_2019_2022.nc --lead-steps 4 --history-steps 4 --zero-residual --time-features --train-until 2021-01-01 --validate-until 2022-01-01 --epochs 40 --group-metrics --hot-weight 2 --hot-threshold-kelvin 305 --lr 0.001 --output outputs/era5-crossyear/cnn-heatweighted
      - run: python scripts/summarize_experiment.py outputs/era5-crossyear/cnn/metrics.json outputs/era5-crossyear/cnn-heatweighted/metrics.json --output outputs/era5-crossyear/heat-comparison.json
      - name: Train intermediate heat weight 1
        run: python -m weatherjax --data input/era5_2019_2022.nc --lead-steps 4 --history-steps 4 --zero-residual --time-features --train-until 2021-01-01 --validate-until 2022-01-01 --epochs 40 --group-metrics --hot-weight 1 --hot-threshold-kelvin 305 --lr 0.001 --output outputs/era5-crossyear/cnn-heatweight1
      - name: Choose heat-loss weight using validation only
        run: python scripts/select_heat_weight.py outputs/era5-crossyear/cnn/metrics.json outputs/era5-crossyear/cnn-heatweight1/metrics.json outputs/era5-crossyear/cnn-heatweighted/metrics.json --output outputs/era5-crossyear/validation-selection.json
      - name: Report independent test of validation-selected model
        run: python scripts/report_selected_heat.py outputs/era5-crossyear/validation-selection.json outputs/era5-crossyear/cnn/metrics.json outputs/era5-crossyear/cnn-heatweight1/metrics.json outputs/era5-crossyear/cnn-heatweighted/metrics.json --output outputs/era5-crossyear/selected-model-test.json
      - name: Evaluate season-hour climatology and validation-selected persistence blend
        run: python scripts/climatology_baselines.py --data input/era5_2019_2022.nc --train-until 2021-01-01 --validate-until 2022-01-01 --lead-steps 4 --output outputs/era5-crossyear/climatology-baselines.json
      - name: Train and score climatology-aware residual CNN against stronger blend
        run: python scripts/climatology_aware_cnn.py --data input/era5_2019_2022.nc --train-until 2021-01-01 --validate-until 2022-01-01 --epochs 40 --output outputs/era5-crossyear/climatology-aware-cnn.json
      - name: Climatology-aware CNN independent-seed robustness
        run: |
          python scripts/climatology_aware_cnn.py --data input/era5_2019_2022.nc --epochs 40 --seed 7 --output outputs/era5-crossyear/climatology-aware-seed7.json
          python scripts/climatology_aware_cnn.py --data input/era5_2019_2022.nc --epochs 40 --seed 123 --output outputs/era5-crossyear/climatology-aware-seed123.json
      - name: Heat-weight sensitivity for climatology-aware CNN (seeds 42, 7, 123)
        run: |
          for seed in 42 7 123; do
            for weight in 0 1 2; do
              python scripts/climatology_aware_cnn.py --data input/era5_2019_2022.nc --epochs 40 --seed "$seed" --hot-weight "$weight" --hot-threshold-kelvin 305 --output "outputs/era5-crossyear/climate-heat-s${seed}-w${weight}.json"
            done
          done
          python scripts/select_climate_heat.py outputs/era5-crossyear/climate-heat-s*.json --output outputs/era5-crossyear/climate-heat-validation-selection.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-2022-era5-metrics
          path: outputs/era5-crossyear/**/*.json
          if-no-files-found: warn
