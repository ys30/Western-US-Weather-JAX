name: ERA5 matched-climatology Southwest 2023 temporal replication
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/era5-matched-crossyear-2023.yml'
permissions:
  contents: read
jobs:
  southwest-2023:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[test,zarr]' gcsfs
      - name: Fetch source training and Southwest 2023 evaluation ERA5
        run: |
          python scripts/fetch_arco_era5.py --start 2019-01-01 --end 2022-12-31 --stride 6 --lat-min 31 --lat-max 43 --lon-min -121 --lon-max -109 --output input/source.nc
          python scripts/fetch_arco_era5.py --start 2019-01-01 --end 2023-12-31 --stride 6 --lat-min 30 --lat-max 36 --lon-min -108 --lon-max -102 --output input/target.nc
      - name: Matched source training and 2023 frozen Southwest evaluation
        run: |
          for seed in 42 7 123; do
            for mode in historical source_mean; do
              python scripts/climatology_aware_cnn.py --data input/source.nc --train-until 2021-01-01 --validate-until 2022-01-01 --epochs 40 --hot-weight 2 --seed "$seed" --climatology-feature-mode "$mode" --checkpoint-path "outputs/crossyear/$mode/seed-$seed.npz" --output "outputs/crossyear/$mode/source-$seed.json"
              python scripts/frozen_spatial_eval.py --data input/target.nc --checkpoint "outputs/crossyear/$mode/seed-$seed.npz" --test-start 2023-01-01 --output "outputs/crossyear/$mode/target-2023-seed-$seed.json" --diagnostics-output "outputs/crossyear/$mode/fields-2023-seed-$seed.npz"
            done
          done
      - name: Direct paired model comparison for 2023
        run: |
          for seed in 42 7 123; do
            for days in 3 7 14 28; do
              python scripts/matched_direct_bootstrap.py --historical "outputs/crossyear/historical/fields-2023-seed-$seed.npz" --source-mean "outputs/crossyear/source_mean/fields-2023-seed-$seed.npz" --days "$days" --output "outputs/crossyear/direct-2023-seed-$seed-block-$days.json"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: southwest-2023-matched-results
          path: |
            outputs/crossyear/**/*.json
            outputs/crossyear/direct-2023-*.json
          if-no-files-found: warn
