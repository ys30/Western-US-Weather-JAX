name: ERA5 year-region matched channel extension
on:
  workflow_dispatch:
    inputs:
      target_region:
        description: Frozen evaluation region
        type: choice
        required: true
        options: [southern_plains, southwest]
      target_year:
        description: Independent calendar-year evaluation
        type: choice
        required: true
        options: ['2023', '2024']
permissions:
  contents: read
jobs:
  matched-region-year:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test,zarr]' gcsfs
      - name: Choose target area
        shell: bash
        env:
          REGION: ${{ inputs.target_region }}
          YEAR: ${{ inputs.target_year }}
        run: |
          if [[ "$REGION" == 'southern_plains' ]]; then
            echo 'LAT_MIN=32' >> "$GITHUB_ENV"
            echo 'LAT_MAX=38' >> "$GITHUB_ENV"
            echo 'LON_MIN=-101' >> "$GITHUB_ENV"
            echo 'LON_MAX=-95' >> "$GITHUB_ENV"
          else
            echo 'LAT_MIN=30' >> "$GITHUB_ENV"
            echo 'LAT_MAX=36' >> "$GITHUB_ENV"
            echo 'LON_MIN=-108' >> "$GITHUB_ENV"
            echo 'LON_MAX=-102' >> "$GITHUB_ENV"
          fi
          echo "TEST_START=$YEAR-01-01" >> "$GITHUB_ENV"
      - name: Fetch ERA5 at six-hourly cadence
        env:
          YEAR: ${{ inputs.target_year }}
        run: |
          python scripts/fetch_arco_era5.py --start 2019-01-01 --end 2022-12-31 --stride 6 --lat-min 31 --lat-max 43 --lon-min -121 --lon-max -109 --output input/source.nc
          python scripts/fetch_arco_era5.py --start 2019-01-01 --end "$YEAR-12-31" --stride 6 --lat-min "$LAT_MIN" --lat-max "$LAT_MAX" --lon-min "$LON_MIN" --lon-max "$LON_MAX" --output input/target.nc
      - name: Matched source fitting and frozen target evaluation
        shell: bash
        run: |
          for seed in 42 7 123; do
            for mode in historical source_mean; do
              python scripts/climatology_aware_cnn.py --data input/source.nc --train-until 2021-01-01 --validate-until 2022-01-01 --epochs 40 --hot-weight 2 --seed "$seed" --climatology-feature-mode "$mode" --checkpoint-path "outputs/archive/$mode/seed-$seed.npz" --output "outputs/archive/$mode/source-$seed.json"
              python scripts/frozen_spatial_eval.py --data input/target.nc --checkpoint "outputs/archive/$mode/seed-$seed.npz" --test-start "$TEST_START" --output "outputs/archive/$mode/target-$seed.json" --diagnostics-output "outputs/archive/$mode/fields-$seed.npz"
            done
            for days in 3 7 14 28; do
              python scripts/matched_direct_bootstrap.py --historical "outputs/archive/historical/fields-$seed.npz" --source-mean "outputs/archive/source_mean/fields-$seed.npz" --days "$days" --draws 2000 --output "outputs/archive/direct-seed-$seed-block-$days.json"
            done
          done
      - name: Save archive provenance
        if: always()
        run: |
          python -m pip freeze > resolved-requirements.txt
          python scripts/hash_experiment_files.py --root input --root outputs/archive --output outputs/archive/sha256-manifest.json
          git rev-parse HEAD > git-commit.txt
          python -c 'import jax; print(jax.__version__,jax.devices())' > device-info.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: era5-${{ inputs.target_region }}-${{ inputs.target_year }}-full-archive
          retention-days: 30
          if-no-files-found: error
          path: |
            input/*.nc
            outputs/archive/**
            resolved-requirements.txt
            git-commit.txt
            device-info.txt
