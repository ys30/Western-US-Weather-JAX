name: Real ERA5 GPU hardware acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gpu-acceptance:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install JAX CUDA and ERA5 dependencies
        run: |
          python -m pip install -e '.[test,zarr]' gcsfs
          python -m pip install -U 'jax[cuda12]'
      - name: Check actual CUDA-backed JAX GPU
        run: |
          python - <<'PY'
          from scripts.gpu_training import require_gpu
          import jax
          devices=require_gpu()
          print("GPU devices:",devices,"JAX backend:",jax.default_backend())
          PY
      - name: Fetch real ERA5 2019-2022
        run: python scripts/fetch_arco_era5.py --start 2019-01-01 --end 2022-12-31 --stride 6 --output input/era5_2019_2022.nc
      - name: Run matched CPU reference
        run: JAX_PLATFORMS=cpu python -m weatherjax --data input/era5_2019_2022.nc --epochs 40 --lead-steps 4 --history-steps 4 --zero-residual --time-features --train-until 2021-01-01 --validate-until 2022-01-01 --hot-weight 2 --hot-threshold-kelvin 305 --output outputs/cpu-parity
      - name: Run hardware-audited GPU training
        run: JAX_PLATFORMS=cuda,cpu python scripts/gpu_training.py --data input/era5_2019_2022.nc --epochs 40 --history-steps 4 --train-until 2021-01-01 --validate-until 2022-01-01 --hot-weight 2 --hot-threshold-kelvin 305 --output outputs/gpu-parity
      - name: Check accuracy parity and descriptive training speed
        run: python scripts/compare_gpu_cpu.py outputs/cpu-parity/metrics.json outputs/gpu-parity/gpu_metrics.json --output outputs/gpu-parity/acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audited-gpu-cpu-acceptance
          path: |
            outputs/cpu-parity/metrics.json
            outputs/gpu-parity/*.json
          if-no-files-found: warn
